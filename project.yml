name: SwipeWipe
options:
  bundleIdPrefix: com.swipewipe
  deploymentTarget:
    iOS: "17.0"
packages:
  SwipeWipe:
    path: SwipeWipe
targets:
  SwipeWipe:
    type: application
    platform: iOS
    sources:
      - path: SwipeWipe/Sources/SwipeWipeApp
        excludes:
          - Info.plist
    dependencies:
      - package: SwipeWipe
        product: SwipeWipeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swipewipe.app
        PRODUCT_NAME: SwipeWipe
        INFOPLIST_FILE: SwipeWipe/Sources/SwipeWipeApp/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""

