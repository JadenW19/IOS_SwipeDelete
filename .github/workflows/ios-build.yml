name: Build & Verify iOS App

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build SwipeWipe for iOS
    runs-on: macos-14

    steps:
      - name: Checkout Code (Native Git)
        run: |
          git init .
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git fetch --depth 1 origin "${{ github.sha }}"
          git checkout FETCH_HEAD

      - name: Select Xcode
        run: |
          for XCODE in /Applications/Xcode_16*.app /Applications/Xcode_15*.app /Applications/Xcode.app; do
            if [ -d "$XCODE" ]; then
              echo "Selecting $XCODE"
              sudo xcode-select -s "$XCODE"
              break
            fi
          done
          xcodebuild -version
          swift --version

      - name: Run E2E Headless Verification Suite
        run: |
          python3 tests/verify_suite.py
          python3 tests/verify_all_milestones.py

      - name: Build Swift Package (SwipeWipeCore & SwipeWipeApp)
        working-directory: ./SwipeWipe
        run: swift build

      - name: Run Native Swift Tests (SwipeWipeCoreTests)
        working-directory: ./SwipeWipe
        run: swift test

      - name: Compile Release Binary for iOS Device (arm64)
        working-directory: ./SwipeWipe
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Using iPhoneOS SDK: $SDK_PATH"
          swift build -c release --triple arm64-apple-ios17.0 --sdk "$SDK_PATH"

      - name: Package iOS App (.ipa)
        run: |
          mkdir -p build/Payload/SwipeWipe.app
          BIN_PATH=$(find ./SwipeWipe/.build -type f -name "SwipeWipeApp" | grep -i "arm64-apple-ios" | grep -i "release" | head -n 1)
          if [ -z "$BIN_PATH" ]; then
            BIN_PATH=$(find ./SwipeWipe/.build -type f -name "SwipeWipeApp" | head -n 1)
          fi
          echo "Found binary at: $BIN_PATH"
          cp "$BIN_PATH" build/Payload/SwipeWipe.app/SwipeWipe
          chmod +x build/Payload/SwipeWipe.app/SwipeWipe
          cp SwipeWipe/Sources/SwipeWipeApp/Info.plist build/Payload/SwipeWipe.app/Info.plist
          cd build
          zip -r SwipeWipe.ipa Payload
          ls -lh SwipeWipe.ipa

      - name: Upload IPA Artifact for Sideloading
        uses: actions/upload-artifact@v4
        with:
          name: SwipeWipe-iOS
          path: build/SwipeWipe.ipa
          retention-days: 14
