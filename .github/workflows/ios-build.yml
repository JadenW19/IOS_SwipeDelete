name: Build & Verify iOS App

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build SwipeWipe for iOS
    runs-on: macos-14

    steps:
      - name: Checkout Code (Native Git)
        run: |
          git init .
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git fetch --depth 1 origin "${{ github.sha }}"
          git checkout FETCH_HEAD

      - name: Select Xcode
        run: |
          for XCODE in /Applications/Xcode_16*.app /Applications/Xcode_15*.app /Applications/Xcode.app; do
            if [ -d "$XCODE" ]; then
              echo "Selecting $XCODE"
              sudo xcode-select -s "$XCODE"
              break
            fi
          done
          xcodebuild -version
          swift --version

      - name: Run E2E Headless Verification Suite
        run: |
          python3 tests/verify_suite.py
          python3 tests/verify_all_milestones.py

      - name: Build Swift Package (SwipeWipeCore & SwipeWipeApp)
        working-directory: ./SwipeWipe
        run: swift build

      - name: Run Native Swift Tests (SwipeWipeCoreTests)
        working-directory: ./SwipeWipe
        run: swift test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS App Bundle (device, unsigned)
        run: |
          xcodebuild build \
            -project SwipeWipe.xcodeproj \
            -scheme SwipeWipe \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package iOS App (.ipa)
        run: |
          APP=build/DerivedData/Build/Products/Release-iphoneos/SwipeWipe.app
          test -d "$APP"
          file "$APP/SwipeWipe"
          plutil -p "$APP/Info.plist"
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build
          zip -qry SwipeWipe.ipa Payload
          ls -lh SwipeWipe.ipa
      - name: Upload IPA Artifact for Sideloading
        uses: actions/upload-artifact@v4
        with:
          name: SwipeWipe-iOS
          path: build/SwipeWipe.ipa
          retention-days: 14
